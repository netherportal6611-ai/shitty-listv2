<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Slate List</title>
  <style>
    :root{--bg:#08090b;--panel:#111417;--panel2:#171b20;--line:#292f36;--line2:#3c454f;--text:#f3f5f7;--muted:#858d96;--soft:#bbc0c6;--accent:#dfe4e8;--danger:#df6c72;--ok:#78b98d;--warn:#d4b65d;--sidebar:230px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{color:inherit}
    :focus-visible{outline:2px solid #fff;outline-offset:2px}
    .sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:#0d0f12;border-right:1px solid var(--line);z-index:10;display:flex;flex-direction:column}
    .brand{height:58px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--line);font-weight:850;letter-spacing:.08em;text-transform:uppercase}.mark{width:20px;height:20px;border:2px solid var(--text);display:grid;place-items:center;font-size:9px}.brand span{color:var(--muted)}
    .side-inner{padding:18px}.eyebrow{color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;margin:0 0 8px}
    .search{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:0;color:var(--text);padding:10px 11px}.search::placeholder{color:#6f777d}
    .filters{display:grid;gap:5px;margin-top:8px}.filter{width:100%;display:flex;align-items:center;gap:9px;text-align:left;background:transparent;border:1px solid transparent;padding:7px 10px;color:var(--muted);cursor:pointer}.filter:hover{background:rgba(255,255,255,.025);border-color:var(--line);color:var(--text)}.filter.active{background:var(--panel2);border-color:#fff;color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 0 14px rgba(255,255,255,.05)}.difficulty-face{width:25px;height:25px;object-fit:contain;flex:0 0 auto}
    .side-actions{margin-top:auto;border-top:1px solid var(--line);padding:12px;display:grid;gap:6px}.btn{border:1px solid var(--line2);background:var(--panel2);padding:8px 11px;cursor:pointer;border-radius:0;font-weight:700;font-size:12px}.btn:hover{background:#20252b;border-color:#565f69}.btn.primary{background:var(--text);color:#0b0d10;border-color:var(--text)}.btn.danger{color:#f3a0a4}.btn.ghost{background:transparent}.btn:disabled{opacity:.45;cursor:not-allowed}
    .main{margin-left:var(--sidebar);min-height:100vh;background:radial-gradient(circle at 65% -25%,rgba(36,49,65,.07),transparent 38%),var(--bg)}.topbar{height:58px;position:sticky;top:0;background:rgba(8,9,11,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:8;display:flex;align-items:stretch;padding:0 28px}.tabs{display:flex}.tab{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:0 20px;text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:850;cursor:pointer}.tab:hover{color:var(--text)}.tab.active{color:var(--text);border-bottom-color:var(--text)}.top-actions{margin-left:auto;display:flex;align-items:center;gap:7px}
    .content{max-width:1260px;margin:auto;padding:30px 30px 80px}.page{display:none}.page.active{display:block;animation:pageIn .22s ease}.page-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:18px}.title{margin:0;font-size:29px;letter-spacing:-.045em;font-weight:900}.sub{margin:5px 0 0;color:var(--muted);font-size:12px}.head-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
    .list{display:grid;gap:6px}.level,.player{border:1px solid var(--line);background:linear-gradient(90deg,rgba(255,255,255,.012),transparent 55%),var(--panel);transition:border-color .18s,box-shadow .18s,background .18s,transform .18s;animation:cardIn .22s ease both}.level:hover,.player:hover{border-color:var(--line2);background:var(--panel2);transform:translateY(-1px)}.level.open,.player.open{border-color:var(--line2);transform:none}
    .row{min-height:74px;display:grid;grid-template-columns:72px minmax(0,1fr) 220px 92px;align-items:stretch;cursor:pointer}.row:hover{background:rgba(255,255,255,.025)}.rank{display:grid;place-items:center;border-right:1px solid var(--line);border-left:3px solid var(--line2);background:rgba(0,0,0,.16);font-size:25px;font-weight:950;letter-spacing:-.04em;font-variant-numeric:tabular-nums}.rank small{font-size:8px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:-15px}.level[data-rank="1"] .rank{color:#f3d36a;text-shadow:0 0 18px rgba(243,211,106,.25)}.level[data-rank="2"] .rank{color:#c9d0d8;text-shadow:0 0 18px rgba(201,208,216,.2)}.level[data-rank="3"] .rank{color:#d69261;text-shadow:0 0 18px rgba(214,146,97,.2)}.level[data-difficulty="Extreme Demon"] .rank{border-left-color:#ef5962}.level[data-difficulty="Extreme Demon"]:hover{box-shadow:0 0 18px rgba(239,89,98,.11)}.level[data-difficulty="Insane Demon"] .rank{border-left-color:#f28b43}.level[data-difficulty="Insane Demon"]:hover{box-shadow:0 0 18px rgba(242,139,67,.1)}.level[data-difficulty="Hard Demon"] .rank{border-left-color:#e8c84f}.level[data-difficulty="Hard Demon"]:hover{box-shadow:0 0 18px rgba(232,200,79,.1)}.level[data-difficulty="Medium Demon"] .rank{border-left-color:#58c77a}.level[data-difficulty="Medium Demon"]:hover{box-shadow:0 0 18px rgba(88,199,122,.1)}.level[data-difficulty="Easy Demon"] .rank{border-left-color:#5eb7e6}.level[data-difficulty="Easy Demon"]:hover{box-shadow:0 0 18px rgba(94,183,230,.1)}.level[data-difficulty="Insane"] .rank{border-left-color:#d96ce8}.level[data-difficulty="Insane"]:hover{box-shadow:0 0 18px rgba(217,108,232,.1)}
    .summary{padding:9px 16px;min-width:0;align-self:center}.name{font-weight:900;font-size:16px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:#939aa3;font-size:11px;margin-top:4px}.meta b{color:#d7dce1}.badge{border:1px solid var(--line2);padding:2px 6px;color:var(--soft);background:rgba(255,255,255,.018);font-size:9px;text-transform:uppercase;letter-spacing:.06em;font-weight:850}.diff-extreme{color:#ff7b82;border-color:#743940;background:rgba(239,89,98,.08)}.diff-insane{color:#ffa464;border-color:#70442c;background:rgba(242,139,67,.08)}.diff-hard{color:#f0d66b;border-color:#665a2c;background:rgba(232,200,79,.08)}.diff-medium{color:#7bd795;border-color:#315b3e;background:rgba(88,199,122,.08)}.diff-easy{color:#7fc9ec;border-color:#31576c;background:rgba(94,183,230,.08)}.diff-normal-insane{color:#e596ef;border-color:#66366d;background:rgba(217,108,232,.08)}
    .level-media{position:relative;width:220px;height:72px;overflow:hidden;border-left:1px solid var(--line);background:#0d0f12}.level-media::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,9,11,.38),transparent 42%,rgba(8,9,11,.08));pointer-events:none}.level-thumb{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.01);transition:transform .25s,filter .25s}.level:hover .level-thumb{transform:scale(1.045);filter:saturate(1.08)}.level-thumb.empty{display:grid;place-items:center;color:#555;background:linear-gradient(135deg,#11151a,#0c0f13);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.row-tools{display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:0 12px}.victor-dots{display:flex;gap:5px;margin-right:4px}.victor-dot{width:8px;height:8px;border-radius:50%;background:#394047}.victor-dot.on{background:var(--text)}.icon{width:31px;height:31px;display:grid;place-items:center;border:1px solid var(--line);background:#111418;cursor:pointer;color:var(--muted);transition:background .15s,border-color .15s,color .15s,transform .1s}.icon:hover{color:var(--text);border-color:var(--line2);background:#1d2228}.icon:active{transform:translateY(1px);background:#0c0e11}.icon:disabled,.btn:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(1)}.chev{transition:transform .18s}.open .chev{transform:rotate(180deg)}
    .details{display:none;border-top:1px solid var(--line);padding:14px}.open>.details{display:block}.info{border:1px solid var(--line);background:#101213;padding:14px}.info-title{border-left:2px solid var(--muted);padding-left:8px;margin-bottom:12px;color:var(--muted);font-size:9px;letter-spacing:.14em;text-transform:uppercase;font-weight:850}.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px 28px}.k{color:var(--muted);font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:800}.v{font-weight:750;margin-top:3px;overflow-wrap:anywhere}.empty{color:#636b71;font-style:italic;font-weight:500}.link{color:var(--text)}
    .player .row{grid-template-columns:70px minmax(0,1fr) auto;min-height:58px}.player .rank{font-size:18px}.completions{display:grid;gap:5px}.completion{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 10px;border:1px solid var(--line);background:var(--panel2);font-size:12px}.completion .pos{color:var(--muted);font-variant-numeric:tabular-nums}.completion .role{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}.no-data{border:1px dashed var(--line2);padding:56px 24px;text-align:center;color:var(--muted);background:linear-gradient(145deg,rgba(255,255,255,.015),transparent);border-radius:12px}.empty-icon{width:42px;height:42px;margin:0 auto 14px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:12px;background:var(--panel2);font-size:19px;color:var(--soft)}.empty-title{font-size:15px;font-weight:850;color:var(--text);margin-bottom:5px}.empty-copy{font-size:12px;color:var(--muted)}
    dialog{width:min(580px,calc(100vw - 24px));border:1px solid var(--line2);border-radius:14px;background:linear-gradient(155deg,#161a1f,#101317);color:var(--text);padding:0;box-shadow:0 28px 90px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.025);overflow:hidden}dialog[open]{animation:dialogIn .18s ease}dialog::backdrop{background:rgba(0,0,0,.78);backdrop-filter:blur(5px)}.dlg-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:17px 19px;background:rgba(255,255,255,.015)}.dlg-head h2{font-size:16px;margin:0;letter-spacing:-.02em}.dlg-body{padding:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.11em;font-weight:800}.field input,.field select,.field textarea{width:100%;background:#0c0e11;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:10px 11px;transition:border-color .15s,box-shadow .15s}.field input:focus,.field select:focus,.field textarea:focus{border-color:#697684;box-shadow:0 0 0 3px rgba(135,151,168,.08);outline:0}.field textarea{resize:vertical;min-height:76px}.dlg-actions{display:flex;justify-content:flex-end;gap:8px;padding:14px 19px;border-top:1px solid var(--line);background:rgba(0,0,0,.13)}.hint{font-size:11px;color:var(--muted);margin:10px 0 0}.sep{height:1px;background:var(--line);margin:18px 0}
    .toast{position:fixed;right:18px;bottom:18px;min-width:220px;background:#171b20;color:var(--text);border:1px solid var(--line2);border-left:3px solid var(--ok);border-radius:8px;padding:11px 14px;box-shadow:0 16px 44px rgba(0,0,0,.45);font-weight:750;font-size:12px;transform:translateY(80px);opacity:0;transition:.22s;z-index:40}.toast.error{border-left-color:var(--danger)}.toast.info{border-left-color:#6baed0}.toast.show{transform:none;opacity:1}.loading-bar{position:fixed;top:0;left:0;right:0;height:2px;z-index:80;overflow:hidden;background:transparent}.loading-bar::after{content:"";display:block;width:35%;height:100%;background:linear-gradient(90deg,transparent,#dfe4e8,transparent);animation:loadingMove 1s linear infinite}.loading-bar.hidden{display:none}.mobile-menu{display:none}.sidebar-overlay{display:none}.account-menu{position:relative;align-self:center}.account-button{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);padding:5px 9px 5px 6px;color:var(--text);cursor:pointer}.account-avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--text);color:#0a0c0f;font-weight:900;font-size:12px}.account-label{font-size:11px;font-weight:800}.account-popover{display:none;position:absolute;right:0;top:calc(100% + 8px);width:230px;padding:12px;background:#15191e;border:1px solid var(--line2);border-radius:9px;box-shadow:0 18px 50px rgba(0,0,0,.55)}.account-menu.open .account-popover{display:block;animation:popoverIn .15s ease}.account-role{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--ok);font-weight:850}.account-email{font-size:11px;color:var(--soft);margin:4px 0 10px;overflow:hidden;text-overflow:ellipsis}.hidden{display:none!important}
    .btn{transition:background .15s,border-color .15s,color .15s,transform .1s}.btn:active{transform:translateY(1px);filter:brightness(.9)}.filter{transition:background .15s,border-color .15s,color .15s,transform .12s}.filter:active{transform:translateX(2px)}.details{animation:detailsIn .18s ease}
    @keyframes pageIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes detailsIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}@keyframes dialogIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}@keyframes popoverIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}@keyframes loadingMove{from{transform:translateX(-120%)}to{transform:translateX(390%)}}
    @media(max-width:820px){:root{--sidebar:0px}.sidebar{display:flex;transform:translateX(-102%);width:min(300px,86vw);box-shadow:18px 0 60px rgba(0,0,0,.55);transition:transform .22s}.sidebar.open{transform:none}.sidebar-overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}.sidebar-overlay.show{opacity:1;pointer-events:auto}.main{margin-left:0}.topbar{padding:0 12px}.content{padding:22px 12px 60px}.mobile-menu{display:inline-flex;align-self:center;margin-right:4px}.page-head{align-items:flex-start;flex-direction:column}.head-actions{justify-content:flex-start}.kv{grid-template-columns:1fr 1fr}.row{grid-template-columns:56px minmax(0,1fr) auto;min-height:68px}.rank{font-size:20px}.level-media{display:none}.row-tools{padding:0 7px}.row-tools .move,.victor-dots{display:none}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.completion{grid-template-columns:52px minmax(0,1fr)}.completion .role{grid-column:2}.account-label{display:none}.top-actions{gap:5px}.top-actions>.btn{padding:7px 8px;font-size:10px}}
    @media(max-width:480px){.tab{padding:0 10px;font-size:9px}.kv{grid-template-columns:1fr}.summary{padding:9px 10px}.name{font-size:14px}.meta .optional{display:none}.icon{width:29px;height:29px}.content{padding-left:8px;padding-right:8px}.title{font-size:24px}.toast{left:10px;right:10px;bottom:10px}.account-popover{position:fixed;right:8px;top:62px}}
  </style>
</head>
<body>
  <div class="loading-bar" id="loading-bar" aria-label="Cargando datos"></div>
  <aside class="sidebar">
    <div class="brand"><div class="mark">SL</div>Slate <span>List</span></div>
    <div class="side-inner">
      <label class="eyebrow" for="search">Buscar</label>
      <input class="search" id="search" placeholder="Nivel o jugador…" autocomplete="off">
      <div id="level-filters">
        <p class="eyebrow" style="margin-top:22px">Dificultad</p>
        <div class="filters">
          <button class="filter" data-filter="Extreme Demon"><img class="difficulty-face" alt="" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Extreme_Demon_Icon.webp">Extreme Demon</button>
          <button class="filter" data-filter="Insane Demon"><img class="difficulty-face" alt="" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Insane_Demon_Icon.webp">Insane Demon</button>
          <button class="filter" data-filter="Hard Demon"><img class="difficulty-face" alt="" src="https://geometrydash.wiki.gg/wiki/Special:Redirect/file/Demon.png">Hard Demon</button>
          <button class="filter" data-filter="Medium Demon"><img class="difficulty-face" alt="" src="https://geometrydash.wiki.gg/wiki/Special:Redirect/file/MediumDemon.png">Medium Demon</button>
          <button class="filter" data-filter="Easy Demon"><img class="difficulty-face" alt="" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Easy_Demon_Icon.webp">Easy Demon</button>
          <button class="filter" data-filter="Insane"><img class="difficulty-face" alt="" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Insane_Icon.svg">Insane</button>
        </div>
      </div>
    </div>
    <div class="side-actions">
      <button class="btn hidden" id="logout-btn">Cerrar sesión</button>
      <button class="btn primary admin-only hidden" id="sync-btn">Guardar lista en Firebase</button>
      <button class="btn admin-only hidden" id="import-btn">Importar datos</button>
      <input class="hidden" type="file" id="import-file" accept=".json,application/json">
      <button class="btn ghost danger admin-only hidden" id="reset-btn">Restablecer ejemplo</button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <main class="main">
    <header class="topbar">
      <button type="button" class="btn mobile-menu" id="mobile-filters" aria-label="Abrir filtros">☰</button>
      <nav class="tabs" aria-label="Secciones">
        <button class="tab active" data-page="levels">Lista</button>
        <button class="tab" data-page="players">Jugadores</button>
      </nav>
      <div class="top-actions">
        <button type="button" class="btn" id="login-btn">Iniciar sesión</button>
        <button type="button" class="btn primary" id="register-btn">Registrarte</button>
        <div class="account-menu hidden" id="account-menu">
          <button type="button" class="account-button" id="account-button"><span class="account-avatar" id="account-avatar">A</span><span class="account-label" id="account-label">Administrador</span></button>
          <div class="account-popover">
            <div class="account-role" id="account-role">Administrador</div>
            <div class="account-email" id="account-email"></div>
            <button type="button" class="btn danger" id="account-logout" style="width:100%">Cerrar sesión</button>
          </div>
        </div>
      </div>
    </header>

    <div class="content">
      <section class="page active" id="page-levels">
        <div class="page-head">
          <div><h1 class="title">Demon List</h1><p class="sub" id="level-count"></p></div>
          <div class="head-actions"><button class="btn primary admin-only hidden" id="add-level">+ Agregar nivel</button></div>
        </div>
        <div class="list" id="level-list"></div>
      </section>
      <section class="page" id="page-players">
        <div class="page-head">
          <div><h1 class="title">Jugadores</h1><p class="sub" id="player-count"></p></div>
          <div class="head-actions"><button class="btn primary admin-only hidden" id="add-player">+ Agregar jugador</button></div>
        </div>
        <div class="list" id="player-list"></div>
      </section>
    </div>
  </main>

  <dialog id="level-dialog">
    <form method="dialog" id="level-form">
      <div class="dlg-head"><h2 id="level-dialog-title">Agregar nivel</h2><button class="icon" value="cancel" aria-label="Cerrar">×</button></div>
      <div class="dlg-body">
        <input type="hidden" id="level-uid">
        <div class="form-grid">
          <div class="field full"><label for="level-name">Nombre</label><input id="level-name" required maxlength="80"></div>
          <div class="field"><label for="level-id">ID de Geometry Dash</label><input id="level-id" inputmode="numeric" maxlength="20"></div>
          <div class="field"><label for="level-diff">Dificultad</label><select id="level-diff"><option>Extreme Demon</option><option>Insane Demon</option><option>Hard Demon</option><option>Medium Demon</option><option>Easy Demon</option><option>Insane</option><option>Sin asignar</option></select></div>
          <div class="field"><label for="level-creator">Creador</label><input id="level-creator" maxlength="40"></div>
          <div class="field"><label for="level-verifier">Verificador</label><input id="level-verifier" maxlength="40" list="players-datalist"></div>
          <div class="field"><label for="level-atts">Intentos</label><input id="level-atts" inputmode="numeric" maxlength="12"></div>
          <div class="field"><label for="level-video">Video / showcase (URL)</label><input id="level-video" type="url"></div>
          <div class="field full"><label for="level-notes">Descripción</label><textarea id="level-notes" maxlength="400"></textarea></div>
        </div>
        <div class="sep"></div>
        <p class="eyebrow">Completions</p>
        <div id="completion-fields"></div>
        <button type="button" class="btn" id="add-completion">+ Agregar completion</button>
        <p class="hint">Las completions se muestran al expandir el jugador. El verificador también cuenta como completion.</p>
      </div>
      <div class="dlg-actions"><button class="btn" value="cancel">Cancelar</button><button class="btn primary" value="default" id="save-level">Guardar</button></div>
    </form>
  </dialog>

  <dialog id="player-dialog">
    <form method="dialog" id="player-form">
      <div class="dlg-head"><h2 id="player-dialog-title">Agregar jugador</h2><button class="icon" value="cancel" aria-label="Cerrar">×</button></div>
      <div class="dlg-body">
        <input type="hidden" id="player-uid">
        <div class="form-grid">
          <div class="field full"><label for="player-name">Nombre</label><input id="player-name" required maxlength="40"></div>
        </div>
        <p class="hint">Luego podés asignarle completions editando cada nivel.</p>
      </div>
      <div class="dlg-actions"><button class="btn" value="cancel">Cancelar</button><button class="btn primary" value="default">Guardar</button></div>
    </form>
  </dialog>

  <dialog id="confirm-dialog">
    <form method="dialog">
      <div class="dlg-head"><h2 id="confirm-title">Confirmar</h2><button class="icon" value="cancel">×</button></div>
      <div class="dlg-body"><p id="confirm-message"></p></div>
      <div class="dlg-actions"><button class="btn" value="cancel">Cancelar</button><button class="btn danger" value="default">Eliminar</button></div>
    </form>
  </dialog>
  <datalist id="players-datalist"></datalist>
  <div class="toast" id="toast"></div>

  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCqhCM3-5Wg0IvyMQ3csxOHD9Ty6zQy0EM",
    authDomain: "shitty-listv2.firebaseapp.com",
    databaseURL: "https://shitty-listv2-default-rtdb.firebaseio.com",
    projectId: "shitty-listv2",
    storageBucket: "shitty-listv2.firebasestorage.app",
    messagingSenderId: "341337793623",
    appId: "1:341337793623:web:d7d0e1bb0009c1c1f1af12",
    measurementId: "G-P7GRT3HH0B"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const database = getDatabase(firebaseApp);
  const auth = getAuth(firebaseApp);

  (() => {
    "use strict";
    const KEY = "slate-list-local-v1";
    const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
    const seed = {version:1,players:[],levels:[]};
    const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
    const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const clone = o => JSON.parse(JSON.stringify(o));
    let state = load(), page = "levels", query = "", difficulty = "", openLevels = new Set(), openPlayers = new Set(), pendingConfirm = null;
    const ADMIN_EMAIL = "netherportal6611@gmail.com";
    let currentUser = null, isAdmin = false;
    function load(){localStorage.removeItem(KEY);return clone(seed)}
    async function save(message="Cambios guardados"){
      if(!isAdmin){toast("Solo el administrador puede guardar");render();return}
      localStorage.setItem(KEY,JSON.stringify(state));render();
      try{await set(ref(database,"slateList"),state);toast(message)}
      catch(err){console.error(err);toast("Guardado local; Firebase rechazó el cambio")}
    }
    function toast(t,type){
      const e=$("#toast");
      const inferred=type||( /no se|error|rechaz|inválid|solo el administrador/i.test(t)?"error":/firebase|local|sesión/i.test(t)?"info":"success");
      e.textContent=t;e.className=`toast ${inferred} show`;clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),2400);
    }
    function setLoading(active){$("#loading-bar").classList.toggle("hidden",!active)}
    function setSidebar(open){$(".sidebar").classList.toggle("open",open);$("#sidebar-overlay").classList.toggle("show",open)}
    function diffClass(d){
      if(d==="Insane")return "diff-normal-insane";
      return "diff-"+({Extreme:"extreme",Insane:"insane",Hard:"hard",Medium:"medium",Easy:"easy"}[String(d).split(" ")[0]]||"");
    }
    function allNames(){return [...new Set([...state.players.map(p=>p.name),...state.levels.flatMap(l=>[l.verifier,...l.completions.map(c=>c.player)])].filter(Boolean))]}
    function rankPlayers(){
      const map=new Map(allNames().map(name=>[name.toLowerCase(),{name,completions:[],score:0}]));
      state.levels.forEach((l,i)=>{
        const add=(name,role,attempts)=>{
          if(!name)return;const k=name.toLowerCase();if(!map.has(k))map.set(k,{name,completions:[],score:0});
          const p=map.get(k);if(!p.completions.some(c=>c.levelUid===l.uid)){p.completions.push({levelUid:l.uid,level:l.name,rank:i+1,role,attempts});p.score+=Math.max(1,state.levels.length-i)}
        };
        add(l.verifier,"Verificador",l.attempts);
        l.completions.forEach(c=>add(c.player,"Completion",c.attempts));
      });
      return [...map.values()].sort((a,b)=>b.score-a.score||b.completions.length-a.completions.length||a.name.localeCompare(b.name));
    }
    function render(){
      const q=query.trim().toLowerCase();
      const levels=state.levels.map((l,i)=>({...l,rank:i+1})).filter(l=>(!difficulty||l.difficulty===difficulty)&&(!q||[l.name,l.creator,l.verifier,l.gdId].join(" ").toLowerCase().includes(q)));
      $("#level-count").textContent=`${levels.length} de ${state.levels.length} niveles`;
      const emptyLevels=state.levels.length===0
        ?'<div class="no-data"><div class="empty-icon">◇</div><div class="empty-title">La lista todavía está vacía</div><div class="empty-copy">Los niveles aparecerán acá cuando el administrador agregue el primero.</div></div>'
        :'<div class="no-data"><div class="empty-icon">⌕</div><div class="empty-title">No encontramos resultados</div><div class="empty-copy">Probá otra búsqueda o desmarcá la dificultad seleccionada.</div></div>';
      $("#level-list").innerHTML=levels.length?levels.map(levelHTML).join(""):emptyLevels;
      const players=rankPlayers().filter(p=>!q||p.name.toLowerCase().includes(q));
      $("#player-count").textContent=`${players.length} jugadores`;
      $("#player-list").innerHTML=players.length?players.map((p,i)=>playerHTML(p,i+1)).join(""):'<div class="no-data"><div class="empty-icon">◎</div><div class="empty-title">Todavía no hay jugadores</div><div class="empty-copy">Aparecerán cuando se registren verificadores o victors.</div></div>';
      $("#players-datalist").innerHTML=allNames().map(n=>`<option value="${esc(n)}">`).join("");
      $("#level-filters").classList.toggle("hidden",page!=="levels");
    }
    function levelHTML(l){
      const isOpen=openLevels.has(l.uid), idx=state.levels.findIndex(x=>x.uid===l.uid);
      const victorCount=(l.completions||[]).filter(c=>c.player).length;
      return `<article class="level ${isOpen?"open":""}" data-level="${esc(l.uid)}" data-rank="${l.rank}" data-difficulty="${esc(l.difficulty||"")}">
        <div class="row" role="button" tabindex="0" aria-expanded="${isOpen}">
          <div class="rank"><div>${l.rank}</div><small>Top</small></div>
          <div class="summary"><div class="name">${esc(l.name)}</div><div class="meta">
            ${l.gdId?`<span class="badge">#${esc(l.gdId)}</span>`:""}<span class="badge ${diffClass(l.difficulty)}">${esc(l.difficulty||"Sin asignar")}</span>
            ${l.attempts?`<span class="badge optional">${esc(l.attempts)} ATTs</span>`:""}
          </div><div class="meta">${l.verifier?`<span>Verificador: <b>${esc(l.verifier)}</b></span>`:""}${l.creator?`<span>· Creador: <b>${esc(l.creator)}</b></span>`:""}</div></div>
          <div class="level-media">${l.image?`<img class="level-thumb" src="${esc(l.image)}" alt="">`:`<div class="level-thumb empty">Sin imagen</div>`}</div>
          <div class="row-tools">
            <div class="victor-dots" aria-label="${victorCount} victors"><span class="victor-dot ${victorCount>=1?"on":""}"></span><span class="victor-dot ${victorCount>=2?"on":""}"></span><span class="victor-dot ${victorCount>=3?"on":""}"></span></div>
            ${isAdmin?`
            <button class="icon move" data-action="up" title="Subir" ${idx===0?"disabled":""}>↑</button>
            <button class="icon move" data-action="down" title="Bajar" ${idx===state.levels.length-1?"disabled":""}>↓</button>
            <button class="icon" data-action="edit" title="Editar">✎</button>
            <button class="icon" data-action="delete" title="Eliminar">×</button>`:""}
            <button class="icon chev" data-action="toggle" title="Ampliar">⌄</button>
          </div>
        </div>
        <div class="details"><div class="info"><div class="info-title">Información</div><div class="kv">
          <div><div class="k">Nombre</div><div class="v">${esc(l.name)}</div></div>
          <div><div class="k">ID</div><div class="v ${l.gdId?"":"empty"}">${l.gdId?`<a class="link" target="_blank" rel="noopener" href="https://gdbrowser.com/${encodeURIComponent(l.gdId)}">${esc(l.gdId)} ↗</a>`:"—"}</div></div>
          <div><div class="k">Dificultad</div><div class="v">${esc(l.difficulty||"Sin asignar")}</div></div>
          <div><div class="k">Creador</div><div class="v ${l.creator?"":"empty"}">${esc(l.creator||"—")}</div></div>
          <div><div class="k">Verificador</div><div class="v ${l.verifier?"":"empty"}">${esc(l.verifier||"—")}</div></div>
          <div><div class="k">Intentos</div><div class="v ${l.attempts?"":"empty"}">${esc(l.attempts||"—")}</div></div>
          ${l.notes?`<div style="grid-column:1/-1"><div class="k">Descripción</div><div class="v">${esc(l.notes)}</div></div>`:""}
          ${l.video?`<div><div class="k">Enlace</div><div class="v"><a class="link" href="${esc(l.video)}" target="_blank" rel="noopener">Abrir video ↗</a></div></div>`:""}
        </div></div></div>
      </article>`;
    }
    function playerHTML(p,rank){
      const isOpen=openPlayers.has(p.name.toLowerCase());
      const comps=p.completions.sort((a,b)=>a.rank-b.rank);
      return `<article class="player ${isOpen?"open":""}" data-player="${esc(p.name)}">
        <div class="row" role="button" tabindex="0" aria-expanded="${isOpen}">
          <div class="rank">${p.score?`#${rank}`:"—"}</div>
          <div class="summary"><div class="name">${esc(p.name)}</div></div>
          <div class="row-tools">${isAdmin?`<button class="icon" data-player-action="edit" title="Renombrar">✎</button><button class="icon" data-player-action="delete" title="Eliminar">×</button>`:""}<button class="icon chev" data-player-action="toggle" title="Mostrar completions">⌄</button></div>
        </div>
        <div class="details">${comps.length?`<div class="completions">${comps.map(c=>`<div class="completion"><span class="pos">Top ${c.rank}</span><b>${esc(c.level)}</b><span class="role">${esc(c.role)}${c.attempts?` · ${esc(c.attempts)} ATTs`:""}</span></div>`).join("")}</div>`:'<div class="no-data">Este jugador todavía no tiene completions.</div>'}</div>
      </article>`;
    }
    function switchPage(next){
      page=next;$$(".tab").forEach(b=>b.classList.toggle("active",b.dataset.page===next));$$(".page").forEach(p=>p.classList.toggle("active",p.id===`page-${next}`));$("#search").placeholder=next==="levels"?"Nivel, creador o verificador…":"Nombre del jugador…";render();
    }
    function openLevel(id){
      const l=id?state.levels.find(x=>x.uid===id):null;
      $("#level-dialog-title").textContent=l?"Editar nivel":"Agregar nivel";$("#level-uid").value=l?.uid||"";$("#level-name").value=l?.name||"";$("#level-id").value=l?.gdId||"";$("#level-diff").value=l?.difficulty||"Extreme Demon";$("#level-creator").value=l?.creator||"";$("#level-verifier").value=l?.verifier||"";$("#level-atts").value=l?.attempts||"";$("#level-video").value=l?.video||"";$("#level-notes").value=l?.notes||"";$("#completion-fields").innerHTML="";(l?.completions||[]).forEach(addCompletionField);$("#level-dialog").showModal();setTimeout(()=>$("#level-name").focus(),50);
    }
    function addCompletionField(c={}){
      const row=document.createElement("div");row.className="form-grid completion-edit";row.style.marginBottom="8px";row.innerHTML=`<div class="field"><label>Jugador</label><input class="comp-player" maxlength="40" list="players-datalist" value="${esc(c.player||"")}"></div><div class="field"><label>Intentos</label><div style="display:flex;gap:6px"><input class="comp-atts" inputmode="numeric" value="${esc(c.attempts||"")}"><button type="button" class="icon remove-completion">×</button></div></div>`;$("#completion-fields").append(row);
    }
    function submitLevel(e){
      e.preventDefault();const name=$("#level-name").value.trim();if(!name){$("#level-name").focus();return}
      const data={uid:$("#level-uid").value||uid(),name,gdId:$("#level-id").value.trim(),difficulty:$("#level-diff").value,creator:$("#level-creator").value.trim(),verifier:$("#level-verifier").value.trim(),attempts:$("#level-atts").value.trim(),video:$("#level-video").value.trim(),notes:$("#level-notes").value.trim(),completions:$$(".completion-edit").map(r=>({player:r.querySelector(".comp-player").value.trim(),attempts:r.querySelector(".comp-atts").value.trim()})).filter(c=>c.player)};
      const i=state.levels.findIndex(x=>x.uid===data.uid);if(i<0)state.levels.push(data);else state.levels[i]={...state.levels[i],...data};$("#level-dialog").close();save(i<0?"Nivel agregado":"Nivel actualizado");
    }
    function openPlayer(name=""){
      const p=state.players.find(x=>x.name.toLowerCase()===name.toLowerCase());$("#player-dialog-title").textContent=p?"Renombrar jugador":"Agregar jugador";$("#player-uid").value=p?.uid||"";$("#player-name").value=p?.name||"";$("#player-dialog").showModal();setTimeout(()=>$("#player-name").focus(),50);
    }
    function submitPlayer(e){
      e.preventDefault();const name=$("#player-name").value.trim();if(!name)return;const id=$("#player-uid").value, existing=state.players.find(p=>p.uid===id);
      if(allNames().some(n=>n.toLowerCase()===name.toLowerCase()&&(!existing||n.toLowerCase()!==existing.name.toLowerCase()))){toast("Ese jugador ya existe");return}
      if(existing){const old=existing.name;existing.name=name;state.levels.forEach(l=>{if(l.verifier.toLowerCase()===old.toLowerCase())l.verifier=name;l.completions.forEach(c=>{if(c.player.toLowerCase()===old.toLowerCase())c.player=name})})}else state.players.push({uid:uid(),name});
      $("#player-dialog").close();save(existing?"Jugador renombrado":"Jugador agregado");
    }
    function confirm(title,message,action){$("#confirm-title").textContent=title;$("#confirm-message").textContent=message;pendingConfirm=action;$("#confirm-dialog").showModal()}
    document.addEventListener("click",e=>{
      const tab=e.target.closest(".tab");if(tab)return switchPage(tab.dataset.page);
      const lf=e.target.closest(".filter");if(lf){const deselect=difficulty===lf.dataset.filter;difficulty=deselect?"":lf.dataset.filter;$$(".filter").forEach(b=>b.classList.toggle("active",!deselect&&b===lf));setSidebar(false);return render()}
      const level=e.target.closest("[data-level]"), act=e.target.closest("[data-action]");
      if(level){const id=level.dataset.level;if(act){e.stopPropagation();const i=state.levels.findIndex(x=>x.uid===id);if(act.dataset.action==="edit")return openLevel(id);if(act.dataset.action==="delete")return confirm("Eliminar nivel",`¿Eliminar “${state.levels[i].name}”?`,()=>{state.levels.splice(i,1);openLevels.delete(id);save("Nivel eliminado")});if(act.dataset.action==="up"&&i>0){[state.levels[i-1],state.levels[i]]=[state.levels[i],state.levels[i-1]];return save("Nivel movido")};if(act.dataset.action==="down"&&i<state.levels.length-1){[state.levels[i+1],state.levels[i]]=[state.levels[i],state.levels[i+1]];return save("Nivel movido")}}openLevels.has(id)?openLevels.delete(id):openLevels.add(id);return render()}
      const player=e.target.closest("[data-player]"), pa=e.target.closest("[data-player-action]");
      if(player){const name=player.dataset.player;if(pa){e.stopPropagation();if(pa.dataset.playerAction==="edit")return openPlayer(name);if(pa.dataset.playerAction==="delete")return confirm("Eliminar jugador",`¿Eliminar a “${name}” y quitar sus completions?`,()=>{state.players=state.players.filter(p=>p.name.toLowerCase()!==name.toLowerCase());state.levels.forEach(l=>{if(l.verifier.toLowerCase()===name.toLowerCase())l.verifier="";l.completions=l.completions.filter(c=>c.player.toLowerCase()!==name.toLowerCase())});openPlayers.delete(name.toLowerCase());save("Jugador eliminado")})}const k=name.toLowerCase();openPlayers.has(k)?openPlayers.delete(k):openPlayers.add(k);return render()}
      if(e.target.closest(".remove-completion"))e.target.closest(".completion-edit").remove();
    });
    document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches(".row")){e.preventDefault();e.target.click()}});
    function updateAuthUI(){
      $("#login-btn").classList.toggle("hidden",!!currentUser);
      $("#logout-btn").classList.toggle("hidden",!currentUser);
      $("#register-btn").classList.toggle("hidden",!!currentUser);
      $("#account-menu").classList.toggle("hidden",!currentUser);
      if(currentUser){
        const label=isAdmin?"Administrador":"Usuario";
        $("#account-label").textContent=label;
        $("#account-role").textContent=label;
        $("#account-email").textContent=currentUser.email||"";
        $("#account-avatar").textContent=(currentUser.displayName||currentUser.email||"A").charAt(0).toUpperCase();
      }
      $$(".admin-only").forEach(e=>e.classList.toggle("hidden",!isAdmin));
    }
    onValue(ref(database,"slateList"),snapshot=>{
      if(snapshot.exists()){
        const remote=snapshot.val();
        if(remote&&Array.isArray(remote.levels)&&Array.isArray(remote.players)){
          state=remote;localStorage.setItem(KEY,JSON.stringify(state));render();
        }
      }else{
        state=clone(seed);localStorage.removeItem(KEY);render();
      }
      setLoading(false);
    },error=>{console.error(error);setLoading(false);toast("Firebase no permite leer todavía","error")});
    onAuthStateChanged(auth,user=>{
      currentUser=user;
      isAdmin=String(user?.email||"").toLowerCase()===ADMIN_EMAIL;
      updateAuthUI();
      render();
    });
    const googleProvider = new GoogleAuthProvider();
    googleProvider.setCustomParameters({prompt:"select_account"});
    async function openGoogleAuth(){
      try{
        await signInWithPopup(auth,googleProvider);
      }catch(err){
        console.error(err);
        const messages={
          "auth/unauthorized-domain":"Falta autorizar este dominio en Firebase",
          "auth/popup-blocked":"El navegador bloqueó la ventana de inicio de sesión",
          "auth/popup-closed-by-user":"Se cerró la ventana antes de iniciar sesión",
          "auth/cancelled-popup-request":"Ya hay una ventana de inicio de sesión abierta",
          "auth/operation-not-allowed":"Activá Google como proveedor en Firebase"
        };
        toast(messages[err?.code]||"No se pudo iniciar sesión con Google");
      }
    }
    $("#login-btn").onclick=openGoogleAuth;
    $("#register-btn").onclick=openGoogleAuth;
    $("#logout-btn").onclick=()=>signOut(auth);
    $("#account-logout").onclick=()=>signOut(auth);
    $("#account-button").onclick=e=>{e.stopPropagation();$("#account-menu").classList.toggle("open")};
    $("#mobile-filters").onclick=()=>setSidebar(true);
    $("#sidebar-overlay").onclick=()=>setSidebar(false);
    document.addEventListener("click",e=>{if(!e.target.closest("#account-menu"))$("#account-menu").classList.remove("open")});
    $("#sync-btn").onclick=()=>save("Lista guardada en Firebase");
    $("#search").addEventListener("input",e=>{query=e.target.value;render()});$("#add-level").onclick=()=>openLevel();$("#add-player").onclick=()=>openPlayer();$("#add-completion").onclick=()=>addCompletionField();$("#level-form").addEventListener("submit",submitLevel);$("#player-form").addEventListener("submit",submitPlayer);
    $("#confirm-dialog").addEventListener("close",()=>{if($("#confirm-dialog").returnValue==="default"&&pendingConfirm)pendingConfirm();pendingConfirm=null});
    $("#import-btn").onclick=()=>$("#import-file").click();$("#import-file").onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.levels)||!Array.isArray(x.players))throw 0;state=x;save("Datos importados")}catch(err){toast("El archivo no es válido")}e.target.value=""};
    $("#reset-btn").onclick=()=>confirm("Restablecer datos","Se reemplazarán los datos locales por el ejemplo inicial.",()=>{state=clone(seed);openLevels.clear();openPlayers.clear();save("Datos restablecidos")});
    render();
  })();
  </script>
</body>
</html>
